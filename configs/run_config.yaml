# =============================================================================
# Post-Training Pipeline 运行配置
# 控制数据规模和评估范围，支持快速验证和完整实验两种模式
# =============================================================================

run_mode: "smoke_test"  # 可选: "smoke_test" | "full_run"

# --- 模型配置 ---
model:
  name: "Qwen/Qwen2.5-1.5B"           # 主方案：1.5B 全量微调
  dtype: "bfloat16"                     # MPS 支持 bf16
  device: "mps"                         # Apple Silicon GPU
  fallback_device: "cpu"                # MPS 不支持时回退

# --- Smoke Test 模式 ---
# 20-30 分钟跑完全流程，验证代码无报错
smoke_test:
  sft_sample_size: 2000                 # SFT 取 2000 条
  dpo_sample_size: 1000                 # DPO 取 1000 对
  eval_tasks: "hellaswag"               # 只跑 1 个 benchmark
  max_steps: 100                        # MPS 上 ~28 分钟
  eval_limit: 200                       # 评估样本上限
  logging_steps: 10                     # 每 10 步记录
  save_steps: 50                        # 每 50 步保存
  description: "20-30分钟跑完全流程，验证代码无报错"

# --- Full Run 模式 ---
# 7-12 小时跑完，产出完整实验结果
full_run:
  sft_sample_size: 57000                # SFT ~57K
  dpo_sample_size: 30000                # DPO ~30K
  eval_tasks: "hellaswag,arc_easy,mmlu,winogrande,truthfulqa"
  max_steps: -1                         # 跑完所有数据
  eval_limit: -1                        # 不限制评估样本
  logging_steps: 10
  save_steps: 500
  description: "7-12小时跑完，产出完整实验结果"

