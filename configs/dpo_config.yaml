# =============================================================================
# DPO 训练配置
# 对应 Tülu 3 论文 Section 4: Preference Tuning with DPO
# =============================================================================

# --- DPO 核心超参数 ---
# Tülu 3 8B: β=5, lr=5e-7, epochs=3
dpo:
  beta: 5.0                           # KL 散度惩罚系数（Tülu 3: β=5）
  loss_type: "sigmoid"                # 标准 DPO loss
  label_smoothing: 0.0                # 不做标签平滑
  # dpo_norm: true                    # 归一化版本，消除长度偏差（可选实验）

# --- 训练超参数 ---
training:
  learning_rate: 5.0e-7               # 比 SFT 低一个量级（Tülu 3 一致）
  num_train_epochs: 3                 # Tülu 3: 3 epochs for 8B
  per_device_train_batch_size: 1      # MPS 内存受限，batch=1
  gradient_accumulation_steps: 32     # 有效 batch_size = 1 × 32 = 32
  warmup_ratio: 0.1                   # DPO 需要更多 warmup
  weight_decay: 0.0
  lr_scheduler_type: "linear"
  max_length: 1024                    # 减小以适配 MPS 内存
  max_prompt_length: 512              # prompt 最大长度
  gradient_checkpointing: true

# --- 优化器 ---
optimizer:
  name: "adamw_torch"
  betas: [0.9, 0.999]
  eps: 1.0e-8

# --- 日志与保存 ---
logging:
  logging_steps: 10
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  eval_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

# --- 输出路径 ---
output:
  dir: "results/checkpoints/dpo"
  logging_dir: "results/logs/dpo"

# --- 数据 ---
data:
  train_file: "data/dpo_mix/train.jsonl"
  eval_split: 0.05
  max_samples: null                   # 由 run_config.yaml 控制

# --- 参考模型 ---
# DPO 需要一个参考模型（ref_model）来计算 KL 散度
# 默认使用 SFT checkpoint
ref_model:
  path: "results/checkpoints/sft"     # SFT 训练后的模型
